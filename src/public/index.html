<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteri Destek Talep Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-ticket { border-left: 5px solid #0d6efd; transition: transform 0.2s; }
        .card-ticket:hover { transform: translateY(-2px); }
        .priority-High { border-left-color: #dc3545 !important; }
        .priority-Medium { border-left-color: #ffc107 !important; }
        .priority-Low { border-left-color: #198754 !important; }
    </style>
</head>
<body>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
            <h1 class="h3 fw-bold text-dark">🎧 Müşteri Destek Talep Sistemi</h1>
            <span class="badge bg-success">API Online</span>
        </header>

        <div class="row g-4">
            <!-- Sol Taraf: Yeni Talep Formu -->
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white fw-bold">➕ Yeni Destek Talebi Aç</div>
                    <div class="card-body">
                        <form id="ticketForm">
                            <div class="mb-3">
                                <label class="form-label">Talep Başlığı</label>
                                <input type="text" id="title" class="form-control" placeholder="Örn: Ödeme Sayfası Hatası" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Açıklama</label>
                                <textarea id="description" class="form-control" rows="3" placeholder="Sorunun detaylarını yazınız..." required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Öncelik Düzeyi</label>
                                <select id="priority" class="form-select">
                                    <option value="Low">Düşük (Low)</option>
                                    <option value="Medium" selected>Orta (Medium)</option>
                                    <option value="High">Yüksek (High)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Talebi Gönder</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Sağ Taraf: Talep Listesi -->
            <div class="col-md-7">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0">📋 Aktif Destek Talepleri</h5>
                    <button onclick="fetchTickets()" class="btn btn-sm btn-outline-secondary">🔄 Yenile</button>
                </div>
                <div id="ticketList" class="d-flex flex-column gap-3">
                    <!-- Dinamik talepler buraya gelecek -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/tickets';

        // Talepleri Getir ve Ekrana Bas
        async function fetchTickets() {
            const res = await fetch(API_URL);
            const tickets = await res.json();
            const listContainer = document.getElementById('ticketList');
            listContainer.innerHTML = '';

            if (tickets.length === 0) {
                listContainer.innerHTML = '<div class="alert alert-info">Henüz oluşturulmuş bir destek talebi yok.</div>';
                return;
            }

            tickets.forEach(ticket => {
                const badgeColor = ticket.status === 'Open' ? 'bg-danger' : ticket.status === 'In Progress' ? 'bg-warning text-dark' : 'bg-success';
                const card = document.createElement('div');
                card.className = `card shadow-sm card-ticket priority-${ticket.priority}`;
                card.innerHTML = `
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <h6 class="fw-bold mb-1">#${ticket.id} - ${ticket.title}</h6>
                            <span class="badge ${badgeColor}">${ticket.status}</span>
                        </div>
                        <p class="text-muted small mb-2">${ticket.description}</p>
                        <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                            <small class="text-muted">Öncelik: <strong>${ticket.priority}</strong></small>
                            <div>
                                ${ticket.status !== 'Closed' ? `
                                    <button onclick="updateStatus(${ticket.id}, 'In Progress')" class="btn btn-sm btn-outline-warning me-1">İşleme Al</button>
                                    <button onclick="updateStatus(${ticket.id}, 'Closed')" class="btn btn-sm btn-outline-success">Kapat</button>
                                ` : '<span class="text-success small fw-bold">✓ Tamamlandı</span>'}
                            </div>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // Yeni Talep Ekle
        document.getElementById('ticketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const priority = document.getElementById('priority').value;

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, priority })
            });

            document.getElementById('ticketForm').reset();
            fetchTickets();
        });

        // Durum Güncelle
        async function updateStatus(id, newStatus) {
            await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            fetchTickets();
        }

        // Sayfa Yüklenince Talepleri Çek
        fetchTickets();
    </script>
</body>
</html>
